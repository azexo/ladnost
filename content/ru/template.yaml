# ==============================================================================
# ГЛОБАЛЬНОЕ ОПИСАНИЕ ЖИЗНЕННОГО ЦИКЛА ШАБЛОНА
# ==============================================================================
# 1. СБОР ДАННЫХ: Пользователь заполняет анкету (properties). Некоторые поля
# могут вычисляться автоматически (FORMULA) или скрываться/показываться
# в зависимости от условий (conditions).
# 2. ВЫЧИСЛЕНИЕ ЛОГИКИ: Система оценивает дерево условий (conditions) на основе
# введенных данных.
# 3. ПОДСТАНОВКА ТЕКСТОВ (СЛОТЫ): Для каждого слота в документе система ищет
# подходящий вариант (variants) на основе истинных условий и подставляет
# соответствующую формулировку (formulations).
# 4. РЕНДЕРИНГ ТАБЛИЦ: Если секция имеет флаг is_table: true, система собирает
# введенные данные по свойствам этой секции и генерирует строки таблицы на основе
# шаблона строки, указанного в document_body.
# 5. РЕНДЕРИНГ: Итоговый Markdown (document_body) заполняется значениями
# свойств, выбранными текстами слотов и сгенерированными таблицами, после чего
# конвертируется в HTML/PDF.
# ==============================================================================

# ==============================================================================
# 1. МЕТАДАННЫЕ ШАБЛОНА
# ==============================================================================
template_metadata:
  # [ОБЯЗАТЕЛЬНО] Название комплекта документов (DocumentSet).
  # Объединяет несколько связанных документов (например, Договор + Приложение + Акт).
  name: "Договор оказания услуг v2"
  
  # [ОПЦИОНАЛЬНО] Название самого документа внутри комплекта.
  # Если не указано, для отображения в UI будет использоваться name.
  document_name: "Основной договор"

# ==============================================================================
# 2. СУЩНОСТИ (НАСТРОЙКИ АНКЕТЫ И ЛОГИКИ)
# ==============================================================================
entities:

  # ----------------------------------------------------------------------------
  # 2.1. СЕКЦИИ (Группы вопросов в анкете)
  # ----------------------------------------------------------------------------
  # Опционально. Если не указаны, секции автоматически создадутся из полей 
  # `section` у properties и conditions (в порядке их первого упоминания).
  # Секции нужны для визуального группирования полей в UI генератора документов.
  sections:
    - name: "Основные положения"
      is_table: false # [ОПЦИОНАЛЬНО] Флаг таблицы. По умолчанию false.
      
    - name: "Финансовые условия"
      is_table: false
      
    - name: "Спецификация"
      is_table: true  # [ФЛАГ ТАБЛИЦЫ] Если true, то свойства данной секции 
                      # интерпретируются не как отдельные поля, а как колонки 
                      # одной таблицы. Данные по этой секции собираются в массив строк.

  # ----------------------------------------------------------------------------
  # 2.2. СВОЙСТВА (Поля анкеты / Переменные)
  # ----------------------------------------------------------------------------
  # Свойства — это источники данных. Они могут вводиться пользователем,
  # вычисляться по формуле или браться из базы данных.
  # В итоговом Markdown они используются как переменные: {{ identifier }}
  properties:
    - identifier: "client_name"           # [ОБЯЗАТЕЛЬНО] Уникальный ключ.
      # Используется в MD как {{ client_name }},
      # а также для ссылок в условиях и формулах.
      name: "Название заказчика"          # Отображаемое имя поля в UI анкеты.
      data_type: "TEXT"                   # Тип данных: TEXT | NUMBER | MONEY | DATE
      text_input_type: "SHORT"            # Тип ввода для TEXT: SHORT | LONG | LIST
      options: []                         # Массив строк для выпадающего списка, если text_input_type = LIST
      section: "Основные положения"       # Имя секции (связь строго по названию)
      value_source: "USER_INPUT"          # Откуда брать данные: USER_INPUT | FORMULA | DATABASE | READONLY
      formula: null                       # Строка формулы, если value_source = FORMULA
      format: "{value}"                   # Шаблон форматирования вывода.
      default_value: "ООО Ромашка"        # Значение по умолчанию
      is_required: true                   # Обязательно для заполнения
      hide_in_form: false                 # Скрыть поле из анкеты
      sort_order: 1                       # Порядок отображения полей внутри секции
      description: null                   # Подробное описание поля
      hint: null                          # Всплывающая подсказка
      placeholder: "Введите ИНН или Название"
      display_condition_id: null          # ID условия. Если условие ЛОЖЬ, поле скрывается.

    - identifier: "contract_sum"
      name: "Сумма договора"
      data_type: "MONEY"                  
      section: "Финансовые условия"
      format: "{value} руб."
      sort_order: 2

    - identifier: "vat_amount"
      name: "Сумма НДС"
      data_type: "MONEY"
      section: "Финансовые условия"
      value_source: "FORMULA"             
      formula: "contract_sum * 0.2"       
      format: "{value} руб."
      hide_in_form: true                  

    # --- СВОЙСТВА ДЛЯ ТАБЛИЦЫ (Колонки) ---
    - identifier: "spec_name"
      name: "Наименование"
      data_type: "TEXT"
      section: "Спецификация"             # Привязка к секции с is_table: true
      sort_order: 1
      is_required: true

    - identifier: "spec_qty"
      name: "Количество"
      data_type: "NUMBER"
      section: "Спецификация"
      sort_order: 2

    - identifier: "spec_price"
      name: "Цена за ед."
      data_type: "MONEY"
      section: "Спецификация"
      format: "{value} руб."
      sort_order: 3

  # ----------------------------------------------------------------------------
  # 2.3. УСЛОВИЯ (Логические правила)
  # ----------------------------------------------------------------------------
  # Условия вычисляются после заполнения анкеты.
  conditions:
    - id: "cond_is_vat"                   # [ОБЯЗАТЕЛЬНО] Уникальный строковый ID.
      name: "Включать НДС?"               
      section: "Финансовые условия"
      is_enabled_default: true            
      sort_order: 1
      # Дерево логики. Поддерживает любую вложенность.
      logic:
        operator: "AND"                   
        rules:                            
          - property: "contract_sum"      
            compare_operator: ">="        
            compare_value: "1000000"      
        groups: []                        

    - id: "cond_client_type"
      name: "Клиент - юрлицо"
      section: "Основные положения"
      logic:
        operator: "OR"                    
        rules:
          - property: "client_name"
            compare_operator: "CONTAINS"  
            compare_value: "ООО"
          - property: "client_name"
            compare_operator: "CONTAINS"
            compare_value: "АО"

  # ----------------------------------------------------------------------------
  # 2.4. ФОРМУЛИРОВКИ (Библиотека текстов)
  # ----------------------------------------------------------------------------
  formulations:
    - id: "form_liability_strict"         
      name: "Ответственность (Строгая)"   
      type: "Стандартные"                 
      text: |                             
        За каждый день просрочки Заказчик уплачивает пени в размере
        {{ penalty_percent }} от суммы задолженности.

    - id: "form_liability_soft"
      name: "Ответственность (Мягкая)"
      type: "Специальные"
      text: "Стороны освобождаются от ответственности при наступлении форс-мажора."

    - id: "form_payment_prepay"
      name: "Предоплата 100%"
      type: "Финансовые"
      text: "Оплата производится в размере 100% предоплаты."

  # ----------------------------------------------------------------------------
  # 2.5. ВАРИАНТЫ / СЛОТЫ (Привязка формулировок к условиям)
  # ----------------------------------------------------------------------------
  variants:
    # Вариант 1: Срабатывает, если условие cond_client_type ИСТИННО
    - identifier: "liability_slot"        
      condition_id: "cond_client_type"    
      formulation_id: "form_liability_strict" 
      is_fallback: false                  

    # Вариант 2: Fallback / По умолчанию
    - identifier: "liability_slot"        
      condition_id: null                  
      formulation_id: "form_liability_soft"
      is_fallback: true                   

    # Вариант 3: Слот без условий (прямая вставка)
    - identifier: "payment_terms_slot"
      condition_id: null
      formulation_id: "form_payment_prepay"
      is_fallback: true                   

# ==============================================================================
# 3. ТЕЛО ДОКУМЕНТА (MARKDOWN)
# ==============================================================================
# Текст документа в формате Markdown.
# Динамические данные вставляются через двойные фигурные скобки: {{ identifier }}.
document_body: |
  ДОГОВОР ОКАЗАНИЯ УСЛУГ № {{ contract_number }}
  г. Москва, {{ sign_date }}

  Заказчик: {{ client_name }}
  Сумма договора: {{ contract_sum }}

  **1. Предмет договора**
  Исполнитель обязуется оказать услуги...

  **2. Ответственность сторон**
  {{ liability_slot }}

  **3. Порядок расчетов**
  {{ payment_terms_slot }}

  **4. Спецификация услуг**
  # Ниже представлен шаблон таблицы. 
  # Шапка таблицы + одна строка, которая является ШАБЛОНОМ строки таблицы.
  # Система автоматически размножит эту строку для каждого набора данных 
  # из секции "Спецификация" (где is_table: true).
  # В каждой ячейке расположен идентификатор соответствующей колонки-свойства.
  
  | Наименование | Количество | Цена за ед. |
  | :--- | :---: | :---: |
  | {{ spec_name }} | {{ spec_qty }} | {{ spec_price }} |
